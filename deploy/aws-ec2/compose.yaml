name: quantum-assisted-unit-commitment

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/aws-ec2/Dockerfile
    image: quantum-assisted-unit-commitment:latest
    container_name: quantum-assisted-unit-commitment
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:8000"
    environment:
      CUDAQ_TARGET: nvidia
      REQUIRE_CUDAQ: "1"
      FRONTEND_DIST: /app/frontend_dist
      GPU_RUN_COOLDOWN_SECONDS: "${GPU_RUN_COOLDOWN_SECONDS:-15}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
